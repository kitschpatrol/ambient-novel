allowBuilds:
  '@tsparticles/engine': false
  esbuild: true
  node-jq: true
  unrs-resolver: true
  workerd: true
auditConfig:
  ignoreGhsas:
    # Vitest 3.2.7 is the last release that supports Vite 5. The advisory only affects the
    # mocker dev server and browser mode, not `vitest run` of Node tests. Drop this after
    # upgrading to Vite 6+ and vitest 5.
    # cspell:disable-next-line
    - GHSA-82fw-gwwq-j7x9
minimumReleaseAgeExclude:
  - '@kitschpatrol/chagent@0.4.0'
overrides:
  # SvelteKit 2's Svelte 4 detection in `client/state.svelte.js` fails in the server bundle,
  # because esbuild reformats `onMount` so it no longer matches the detection regex. Rollup
  # 4.64.5 tree-shakes the runes branch that runs instead. Rollup 4.64.6+ keeps it
  # (rollup/rollup#6551), so prerendering throws `$state is not defined`. Remove after
  # upgrading to Svelte 5.
  vite@5>rollup: 4.64.5
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - case-police
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
